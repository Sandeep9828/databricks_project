# This is a Databricks asset bundle definition for dlt_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dlt_pipeline
  uuid: 63b8bc62-a505-46a5-9f63-f0eecdd87dd4

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id: 
    description: warehouse_id

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e0498360-e79d.cloud.databricks.com
    variables:
      catalog: dlt_pipeline_dev
      schema: dev
      warehouse_id: a47fd3173ea7acce
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-e0498360-e79d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ss5592621@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/databricks_project
    variables:
      catalog: dlt_pipeline_prod
      schema: prod
      warehouse_id: a47fd3173ea7acce
    permissions:
      - user_name: ss5592621@gmail.com
        level: CAN_MANAGE
