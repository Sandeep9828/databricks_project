resources:
  jobs:
    earthquake_end_to_end_dev:
      name: earthquake_end_to_end_dev
      tasks:
        - task_key: bronze_layer
          notebook_task:
            notebook_path: ../src/notebook/bronze_ingestion.ipynb
            base_parameters:
              catalog: dlt_pipeline_dev
            source: WORKSPACE
        - task_key: bronze_to_silver
          depends_on:
            - task_key: bronze_layer
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_silver_etl.id}
            full_refresh: false
        - task_key: earthQuake_dashboard
          depends_on:
            - task_key: bronze_to_silver
          dashboard_task:
            subscription:
              subscribers:
                - user_name: sandeepsinghshekhawat924@gmail.com
            warehouse_id: a47fd3173ea7acce
            dashboard_id: ${resources.dashboards.earthquake_monitor.id}
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED
